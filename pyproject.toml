[project]
name = "jev-benchmark"
version = "0.1.0"
description = "Benchmark för känslig personinformation i svensk text (PoC)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]
exclude = ["benchmark/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
